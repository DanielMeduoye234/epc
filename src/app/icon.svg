<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="50%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <!-- Inner Glow / Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#7C2D12" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Modern Squircle Rounded Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Subtle Inner Ring Highlight -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="4" />

  <!-- Church Cross & Flame / Heart Symbol (Filter applied) -->
  <g filter="url(#glow)">
    <!-- Stylized Heart Outline (The Love of Christ) -->
    <path d="M256 410 C256 410 110 310 110 195 C110 135 155 90 205 90 C235 90 256 115 256 115 C256 115 277 90 307 90 C357 90 402 135 402 195 C402 310 256 410 256 410 Z"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="26"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Holy Cross (Central Pillar of Faith) -->
    <!-- Vertical Cross Beam -->
    <line x1="256" y1="120" x2="256" y2="350" stroke="#FFFFFF" stroke-width="32" stroke-linecap="round" />
    <!-- Horizontal Cross Beam -->
    <line x1="180" y1="190" x2="332" y2="190" stroke="#FFFFFF" stroke-width="32" stroke-linecap="round" />

    <!-- Holy Spirit Flame Accent at Top -->
    <path d="M256 60 C242 80 236 100 256 115 C276 100 270 80 256 60 Z" fill="#FEF08A" />
  </g>

  <!-- EPC Text Monogram Badge at Bottom Right -->
  <g transform="translate(320, 395)">
    <rect width="145" height="56" rx="28" fill="#FFFFFF" />
    <text x="72.5" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" fill="#EA580C" letter-spacing="1.5">EPC</text>
  </g>
</svg>
